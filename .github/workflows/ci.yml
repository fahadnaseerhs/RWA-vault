# ─────────────────────────────────────────────────────────────────────────────
# RWA-Vault CI pipeline
#
# Three independent jobs, designed to be selected as required status checks
# in GitHub Settings → Branches → Branch protection for `main`:
#
#   1. node           — lint, typecheck, build and test all TS/JS workspace
#                       packages (apps/*, services/*, packages/*).
#   2. contracts      — fast Foundry checks: build, format, unit + fuzz tests
#                       at the default 1K-run fuzz depth.
#   3. contracts-invariants — slow Foundry invariant fuzzing at 1M runs,
#                       gating contract changes without blocking fast feedback.
#   4. pq-native      — Linux/Windows native builds, lint, tests, provenance,
#                       the ADR 0007 `kat` guard, and differential oracle.
#   5. pq-wasm        — strict WASM build, browser entropy/API checks, and the
#                       bidirectional native/WASM Falcon equivalence test.
#
# Branch protection should require ALL FIVE to pass before merging. Combined
# with the two-approval merge rule in CONTRIBUTING.md, this ensures:
#   - Every merge is reviewed by ≥2 developers
#   - Every merge passes the same lint/type/build/test standard everywhere
#   - Contract changes pass both unit tests AND high-run invariant fuzzing
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main] # Run on direct pushes to main (should be rare with branch protection)
  pull_request:
    branches: [main] # Run on every PR targeting main

# Job names below are the required status checks to select in
# Settings -> Branches -> Branch protection for `main`.
jobs:
  # ─── Job 1: Node.js workspace ────────────────────────────────────────────
  # Runs all recursive pnpm scripts across the 11 workspace packages.
  # Uses the .nvmrc file to pin the Node version, and corepack to enforce
  # the exact pnpm version from package.json's "packageManager" field.
  node:
    name: node (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile ensures CI never silently updates the lockfile.
      # If pnpm-lock.yaml is out of date, the install fails — the developer
      # must run `pnpm install` locally and commit the updated lockfile.
      - run: pnpm install --frozen-lockfile

      # These four commands are the "clean-clone bar" from CONTRIBUTING.md.
      # If any fails, Step 1 isn't finished and the PR can't merge.
      - run: pnpm lint # → pnpm -r run lint (recursive ESLint)
      - run: pnpm typecheck # → pnpm -r run typecheck (tsc --build, project references)
      - run: pnpm build # → pnpm -r run build (tsc --build, emits dist/)
      - run: pnpm test # → pnpm -r run test (currently echo stubs)

      # Formatting is checked separately from lint because Prettier and
      # ESLint serve different purposes: Prettier handles whitespace/style,
      # ESLint handles correctness/patterns. eslint-config-prettier disables
      # the rules that would conflict.
      - run: pnpm format:check # → prettier --check across the repo

  # ─── Job 2: Contracts (fast) ─────────────────────────────────────────────
  # Fast-feedback Foundry checks: compile, format enforcement, and unit +
  # fuzz tests at the default 1K-run depth. Typically completes in < 60s.
  contracts:
    name: contracts (build, test, fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts # All commands run from contracts/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Pull forge-std, openzeppelin, etc.

      # Install Foundry toolchain (forge, anvil, cast, chisel).
      #
      # `version: stable` pins to Foundry's stable release channel rather than
      # whatever nightly happened to be current on the runner that day — this
      # is what makes "it passed in CI last week, why does it fail today"
      # bugs traceable to an actual Foundry changelog instead of silent drift.
      # Foundry ships dated nightly builds rather than semver tags; once the
      # team wants byte-for-byte reproducibility, replace `stable` with an
      # exact nightly tag from https://github.com/foundry-rs/foundry/releases
      # (e.g. "nightly-de33b6af..."), and mirror the same tag in every
      # developer's local `foundryup -v <tag>` (see CONTRIBUTING.md).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: forge build # Compile all Solidity sources
      - run: forge fmt --check # Enforce `forge fmt` formatting
      - run: forge test -vvv # Unit + fuzz tests (1K runs, default profile)

  # ─── Job 3: Contracts (invariants, slow) ─────────────────────────────────
  # Contract changes must additionally pass the invariant suite before merge.
  # Split from the unit job because 1e6-run fuzzing is slow and should not
  # block fast feedback on the cheap checks above.
  #
  # This job uses FOUNDRY_PROFILE=ci, which activates the [profile.ci.fuzz]
  # section in foundry.toml (runs = 1,000,000). The extra depth is critical
  # for catching rounding edge cases in:
  #   - ERC-4626 virtual-share offset (AssetVault, M4)
  #   - Health-factor boundary transitions (LendingPool, M7)
  #   - Reserve-buffer solvency invariants (M7)
  contracts-invariants:
    name: contracts (invariants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Only run tests under test/invariant/ — these are the property-based
      # and invariant tests, not the unit tests (already covered above).
      - name: Invariant and property fuzzing
        run: forge test --match-path "test/invariant/**" -vvv
        env:
          FOUNDRY_PROFILE: ci # → 1,000,000 fuzz runs (foundry.toml)

  # ─── Job 4: pq-core native crate ─────────────────────────────────────────
  # The cryptographic core is vendored C compiled by our own build.rs, so the
  # things that can go wrong are not things `cargo build` reports:
  #
  #   - vendored bytes drifting from the pinned upstream commit,
  #   - a build that links but is subtly wrong and still self-verifies,
  #   - the deterministic `kat` hooks reaching an optimised artefact.
  #
  # Each gets an explicit step below. The toolchain is pinned to the crate's
  # rust-version so a clippy or rustfmt change upstream cannot turn this job red
  # on an unrelated PR.
  pq-native:
    name: pq-native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python runs on both platforms, not just Linux: the vendoring checks below
      # are Linux-only, but the S2-15 artefact scan must see the Windows cdylib
      # and rlib too — those are different files with different linkers.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: clippy, rustfmt

      # The vendored tree is the crate's source of truth for the C. If it is not
      # committed, every check below would be verifying something CI generated
      # for itself, so fail loudly rather than silently passing.
      - name: Vendored PQClean tree is committed
        if: runner.os == 'Linux'
        run: |
          test -f packages/pq-core/native/vendor/pqclean/PROVENANCE.md || {
            echo "::error::vendor/pqclean is not committed. Run scripts/vendor-pqclean.py and commit the result."
            exit 1
          }

      # Compares every vendored byte, SHA-256 and Git blob ID against the objects
      # in the pinned upstream commit. This is the check a self-attesting manifest
      # cannot make: a manifest regenerated over tampered files agrees with itself.
      - name: Verify vendored provenance against pinned upstream
        if: runner.os == 'Linux'
        run: python scripts/verify-vendor.py

      # Re-vendoring must be a no-op. Catches a hand-edited vendor tree whose
      # manifest was updated to match, and any Git filter (autocrlf) that would
      # make the result depend on the machine it ran on.
      - name: Re-vendoring is reproducible
        if: runner.os == 'Linux'
        run: |
          python scripts/vendor-pqclean.py
          if [ -n "$(git status --porcelain -- packages/pq-core/native/vendor)" ]; then
            echo "::error::re-running the vendoring script changed the tree:"
            git status --porcelain -- packages/pq-core/native/vendor
            git diff -- packages/pq-core/native/vendor | head -50
            exit 1
          fi

      - name: Format
        working-directory: packages/pq-core/native
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        working-directory: packages/pq-core/native
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (release)
        working-directory: packages/pq-core/native
        run: cargo build --locked --release

      # S2-15/ADR 0007: the deterministic hooks must be absent from the artefact,
      # not merely unreachable in it. The scan runs against the release build
      # above, and its --self-test runs first so a scanner that matched nothing
      # cannot pass by finding nothing. The linked cdylib is a weak witness on
      # its own — an unexported Rust fn is dead-stripped from it even when
      # compiled — so the rlib's object members and archive symbol index are
      # what actually carry the proof.
      - name: Deterministic KAT hooks are absent from the release artefacts
        run: |
          python scripts/verify-no-kat-symbols.py --self-test
          python scripts/verify-no-kat-symbols.py packages/pq-core/native/target/release

      # Debug and release both run: the FFI round-trips are the only thing that
      # forces the linker to resolve the vendored C at all.
      - name: Test (debug)
        working-directory: packages/pq-core/native
        run: cargo test --locked

      - name: Test (release)
        working-directory: packages/pq-core/native
        run: cargo test --locked --release

      # ADR 0007: an optimised build with `kat` must not compile. Because the
      # guard is a compile_error!, a release build that succeeds is itself proof
      # that `kat` was not in its resolved feature set — no separate assertion on
      # the feature list is needed, and none could be as strong.
      - name: kat feature is refused in an optimised build
        if: runner.os == 'Linux'
        working-directory: packages/pq-core/native
        run: |
          if cargo build --locked --release --features kat 2>/dev/null; then
            echo "::error::the kat guard did not fire: a release build with --features kat succeeded"
            exit 1
          fi
          echo "kat correctly refused in an optimised build"

      # The conformance suite still needs optimised code, and gets it only by
      # acknowledging the guard explicitly. This job publishes a test report; it
      # produces no artefact.
      - name: Conformance build (kat, acknowledged override)
        if: runner.os == 'Linux'
        working-directory: packages/pq-core/native
        env:
          RUSTFLAGS: "-C debug-assertions=on"
        run: cargo test --locked --release --features kat

      # ADR 0003 differential oracle. It cannot be a dev-dependency — it vendors
      # PQClean under the same symbol names, so linking both into one binary
      # fails on MSVC and silently binds to one implementation on GNU ld. The
      # comparison therefore runs across a process boundary. Direction 1 (the
      # oracle's artefacts accepted by our build) ran in the test steps above;
      # this is direction 2.
      - name: Differential oracle (our artefacts checked by independent build)
        if: runner.os == 'Linux'
        working-directory: packages/pq-core/native
        run: |
          test -s target/differential/native-vectors.txt || {
            echo "::error::the release test run did not emit native-vectors.txt"
            exit 1
          }
          cargo run --locked --release --manifest-path oracle/Cargo.toml -- \
            verify target/differential/native-vectors.txt

  # ─── Job 5: pq-core WebAssembly and browser equivalence ─────────────────
  pq-wasm:
    name: pq-wasm (build, Chromium, cross-runtime, tsc)
    runs-on: ubuntu-latest
    needs: pq-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Emit native Falcon fixture
        working-directory: packages/pq-core/native
        run: >-
          cargo run --locked --release --example falcon_interop --
          emit ../browser-tests/artifacts

      - name: Build web package with no unresolved symbols
        working-directory: packages/pq-core
        env:
          WASM32_UNKNOWN_UNKNOWN_CLANG: clang
          RUSTFLAGS: "-C link-arg=--error-unresolved-symbols"
        run: wasm-pack build native --target web --out-dir ../pkg --release --locked

      - name: WASM C preprocessor uses no host headers
        run: python scripts/verify-wasm-preprocessor.py

      - name: WASM imports no C runtime from the host
        run: >-
          python scripts/verify-wasm-imports.py
          packages/pq-core/native/target/wasm32-unknown-unknown/release/rwa_vault_pq_core.wasm

      # The browser artefact is shipped to end users, so it gets the same S2-15
      # scan as the native release build.
      - name: Deterministic KAT hooks are absent from the WASM artefact
        run: >-
          python scripts/verify-no-kat-symbols.py
          packages/pq-core/native/target/wasm32-unknown-unknown/release/rwa_vault_pq_core.wasm
          packages/pq-core/pkg/rwa_vault_pq_core_bg.wasm

      - name: Browser accepts native and emits WASM fixture
        run: node packages/pq-core/browser-tests/run.mjs

      - name: Native accepts WASM fixture
        working-directory: packages/pq-core/native
        run: >-
          cargo run --locked --release --example falcon_interop --
          verify ../browser-tests/artifacts

      - name: TypeScript package compiles
        run: pnpm --filter @rwa-vault/pq-core typecheck
